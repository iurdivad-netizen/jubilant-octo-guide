<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>French AI Conversation Practice - Standalone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .screen {
            display: none;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .setup-container h2 {
            color: #333;
            margin-bottom: 20px;
            margin-top: 30px;
        }

        .setup-container h2:first-child {
            margin-top: 0;
        }

        .api-key-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }

        .api-key-section h2 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #333;
        }

        .api-key-section input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .api-key-section input:focus {
            outline: none;
            border-color: #667eea;
        }

        .api-key-section small {
            color: #666;
            display: block;
            margin-top: 5px;
        }

        .api-key-section a {
            color: #667eea;
        }

        .selection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .selection-card {
            padding: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
        }

        .selection-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .selection-card.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .selection-card h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .selection-card p {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .btn-primary, .btn-secondary {
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 100%;
            margin-top: 20px;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
            padding: 10px 20px;
            font-size: 0.9rem;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .conversation-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .session-info {
            display: flex;
            gap: 10px;
        }

        .badge {
            padding: 8px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .chat-container {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .message {
            display: flex;
            margin-bottom: 15px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.ai {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 1rem;
            line-height: 1.5;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message.ai .message-bubble {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
        }

        .input-container {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .transcription-box {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            min-height: 80px;
        }

        .transcription-text {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 5px;
        }

        .interim-text {
            font-size: 1rem;
            color: #999;
            font-style: italic;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }

        .btn-mic, .btn-speak {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-mic:hover, .btn-speak:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.4);
        }

        .btn-mic.recording {
            background: #ef4444;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            }
            50% {
                box-shadow: 0 0 0 15px rgba(239, 68, 68, 0);
            }
        }

        .btn-send {
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-send:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-bar {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            background: #f0f0f0;
        }

        #statusText {
            font-size: 0.9rem;
            color: #666;
        }

        #statusText.listening {
            color: #667eea;
            font-weight: 600;
        }

        #statusText.thinking {
            color: #764ba2;
            font-weight: 600;
        }

        #statusText.error {
            color: #ef4444;
            font-weight: 600;
        }

        .chat-container::-webkit-scrollbar {
            width: 8px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: #f0f0f0;
            border-radius: 4px;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 4px;
        }

        .chat-container::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }

            .screen {
                padding: 20px;
            }

            .selection-grid {
                grid-template-columns: 1fr;
            }

            .chat-container {
                height: 300px;
            }

            .message-bubble {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🇫🇷 French Conversation Practice</h1>
            <p>Practice speaking French with AI at your level</p>
        </header>

        <div id="setupScreen" class="screen active">
            <div class="setup-container">
                <div class="api-key-section">
                    <h2>API Configuration</h2>
                    <input type="password" id="apiKeyInput" placeholder="Enter your Anthropic API key">
                    <small>Get your API key from <a href="https://console.anthropic.com/" target="_blank">Anthropic Console</a>. Your key is stored locally in your browser.</small>
                </div>

                <h2>Choose Your Level</h2>
                <div id="levelSelection" class="selection-grid"></div>

                <h2>Choose a Topic</h2>
                <div id="topicSelection" class="selection-grid"></div>

                <button id="startBtn" class="btn-primary" disabled>Start Conversation</button>
            </div>
        </div>

        <div id="conversationScreen" class="screen">
            <div class="conversation-header">
                <div class="session-info">
                    <span id="currentLevel" class="badge"></span>
                    <span id="currentTopic" class="badge"></span>
                </div>
                <button id="endBtn" class="btn-secondary">End Conversation</button>
            </div>

            <div id="chatContainer" class="chat-container"></div>

            <div class="input-container">
                <div class="transcription-box">
                    <div id="transcriptionText" class="transcription-text">
                        Click microphone to start speaking...
                    </div>
                    <div id="interimText" class="interim-text"></div>
                </div>

                <div class="controls">
                    <button id="micBtn" class="btn-mic" title="Click to speak">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            <line x1="12" y1="19" x2="12" y2="23"></line>
                            <line x1="8" y1="23" x2="16" y2="23"></line>
                        </svg>
                    </button>
                    <button id="sendBtn" class="btn-send" disabled>Send</button>
                    <button id="speakBtn" class="btn-speak" title="Hear AI response">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="status-bar">
                <span id="statusText">Ready</span>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const LEVELS = {
            A1: {
                name: 'Beginner (A1)',
                description: 'Basic phrases and simple sentences',
                instructions: 'Use very simple vocabulary, present tense primarily, short sentences. Speak slowly and clearly. Use common everyday expressions.'
            },
            A2: {
                name: 'Elementary (A2)',
                description: 'Simple conversations about familiar topics',
                instructions: 'Use simple vocabulary and common phrases. Include past and future tenses occasionally. Keep sentences relatively short but can be slightly more complex.'
            },
            B1: {
                name: 'Intermediate (B1)',
                description: 'Conversations about experiences and events',
                instructions: 'Use intermediate vocabulary. Mix various tenses. Discuss opinions and experiences. Use some idiomatic expressions.'
            },
            B2: {
                name: 'Upper Intermediate (B2)',
                description: 'Complex conversations and abstract topics',
                instructions: 'Use advanced vocabulary and complex sentence structures. Discuss abstract topics. Use subjunctive mood and various tenses appropriately.'
            },
            C1: {
                name: 'Advanced (C1)',
                description: 'Fluent conversation on complex topics',
                instructions: 'Use sophisticated vocabulary and complex grammatical structures. Discuss nuanced topics. Use idiomatic expressions and cultural references.'
            },
            C2: {
                name: 'Mastery (C2)',
                description: 'Near-native fluency',
                instructions: 'Use native-like expressions, subtle nuances, literary references, and complex rhetorical devices. Speak naturally about any topic.'
            }
        };

        const TOPICS = {
            daily_life: { name: 'Daily Life', description: 'Everyday activities, routines, hobbies' },
            travel: { name: 'Travel', description: 'Trips, tourism, cultural experiences' },
            food: { name: 'Food & Dining', description: 'Cuisine, restaurants, cooking' },
            work: { name: 'Work & Career', description: 'Professional life, jobs, business' },
            culture: { name: 'Culture & Arts', description: 'Movies, books, music, art' },
            technology: { name: 'Technology', description: 'Digital life, innovation, science' },
            health: { name: 'Health & Wellness', description: 'Fitness, medicine, wellbeing' },
            environment: { name: 'Environment', description: 'Nature, climate, sustainability' },
            education: { name: 'Education', description: 'Learning, schools, knowledge' },
            social: { name: 'Social Issues', description: 'Society, current events, politics' }
        };

        // Global state
        let selectedLevel = null;
        let selectedTopic = null;
        let apiKey = '';
        let recognition = null;
        let synthesis = window.speechSynthesis;
        let isRecording = false;
        let currentTranscript = '';
        let lastAIResponse = '';
        let conversationHistory = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadApiKey();
            renderLevels();
            renderTopics();
            setupEventListeners();
            setupSpeechRecognition();
        });

        // Load API key from localStorage
        function loadApiKey() {
            const stored = localStorage.getItem('anthropic_api_key');
            if (stored) {
                document.getElementById('apiKeyInput').value = stored;
                apiKey = stored;
            }
        }

        // Save API key to localStorage
        function saveApiKey() {
            apiKey = document.getElementById('apiKeyInput').value.trim();
            if (apiKey) {
                localStorage.setItem('anthropic_api_key', apiKey);
            }
            checkCanStart();
        }

        // Render levels
        function renderLevels() {
            const container = document.getElementById('levelSelection');
            Object.entries(LEVELS).forEach(([key, level]) => {
                const card = document.createElement('div');
                card.className = 'selection-card';
                card.innerHTML = `<h3>${level.name}</h3><p>${level.description}</p>`;
                card.addEventListener('click', () => selectLevel(key, card));
                container.appendChild(card);
            });
        }

        // Render topics
        function renderTopics() {
            const container = document.getElementById('topicSelection');
            Object.entries(TOPICS).forEach(([key, topic]) => {
                const card = document.createElement('div');
                card.className = 'selection-card';
                card.innerHTML = `<h3>${topic.name}</h3><p>${topic.description}</p>`;
                card.addEventListener('click', () => selectTopic(key, card));
                container.appendChild(card);
            });
        }

        // Select level
        function selectLevel(level, card) {
            selectedLevel = level;
            document.querySelectorAll('#levelSelection .selection-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            checkCanStart();
        }

        // Select topic
        function selectTopic(topic, card) {
            selectedTopic = topic;
            document.querySelectorAll('#topicSelection .selection-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            checkCanStart();
        }

        // Check if can start
        function checkCanStart() {
            const apiKeyValue = document.getElementById('apiKeyInput').value.trim();
            document.getElementById('startBtn').disabled = !(selectedLevel && selectedTopic && apiKeyValue);
        }

        // Setup event listeners
        function setupEventListeners() {
            document.getElementById('apiKeyInput').addEventListener('input', saveApiKey);
            document.getElementById('startBtn').addEventListener('click', startConversation);
            document.getElementById('endBtn').addEventListener('click', endConversation);
            document.getElementById('micBtn').addEventListener('click', toggleRecording);
            document.getElementById('sendBtn').addEventListener('click', sendMessage);
            document.getElementById('speakBtn').addEventListener('click', speakLastResponse);
        }

        // Setup speech recognition
        function setupSpeechRecognition() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                showStatus('Speech recognition not supported. Please use Chrome.', 'error');
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'fr-FR';
            recognition.continuous = false;
            recognition.interimResults = true;

            recognition.onstart = () => {
                isRecording = true;
                document.getElementById('micBtn').classList.add('recording');
                showStatus('Listening...', 'listening');
                document.getElementById('transcriptionText').textContent = 'Listening...';
            };

            recognition.onresult = (event) => {
                let interim = '', final = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        final += transcript;
                    } else {
                        interim += transcript;
                    }
                }
                if (final) {
                    currentTranscript = final;
                    document.getElementById('transcriptionText').textContent = final;
                    document.getElementById('interimText').textContent = '';
                    document.getElementById('sendBtn').disabled = false;
                } else {
                    document.getElementById('interimText').textContent = interim;
                }
            };

            recognition.onerror = (event) => {
                isRecording = false;
                document.getElementById('micBtn').classList.remove('recording');
                showStatus(event.error === 'no-speech' ? 'No speech detected' : `Error: ${event.error}`, 'error');
            };

            recognition.onend = () => {
                isRecording = false;
                document.getElementById('micBtn').classList.remove('recording');
                if (!currentTranscript) showStatus('Ready', 'ready');
            };
        }

        // Toggle recording
        function toggleRecording() {
            if (!recognition) return;
            if (isRecording) {
                recognition.stop();
            } else {
                currentTranscript = '';
                document.getElementById('sendBtn').disabled = true;
                recognition.start();
            }
        }

        // Start conversation
        function startConversation() {
            saveApiKey();
            conversationHistory = [];
            document.getElementById('currentLevel').textContent = selectedLevel;
            document.getElementById('currentTopic').textContent = selectedTopic;
            document.getElementById('setupScreen').classList.remove('active');
            document.getElementById('conversationScreen').classList.add('active');
            addMessage('ai', 'Bonjour! Ready to practice French? Start speaking by clicking the microphone!');
            showStatus('Click microphone to speak', 'ready');
        }

        // Send message to Claude API
        async function sendMessage() {
            if (!currentTranscript || !apiKey) return;

            const userMessage = currentTranscript;
            currentTranscript = '';
            addMessage('user', userMessage);
            document.getElementById('transcriptionText').textContent = 'Click microphone to start speaking...';
            document.getElementById('sendBtn').disabled = true;
            showStatus('AI is thinking...', 'thinking');

            conversationHistory.push({ role: 'user', content: userMessage });

            const level = LEVELS[selectedLevel];
            const topic = TOPICS[selectedTopic];
            const systemPrompt = `You are a French conversation partner helping someone practice French at the ${level.name} level.

Topic: ${topic.name} - ${topic.description}

Instructions:
- ${level.instructions}
- Always respond in French
- Be encouraging and patient
- Gently correct grammar mistakes naturally
- Ask follow-up questions
- Stay on topic: ${topic.name}
- Keep responses conversational (2-4 sentences)
- Adapt to user's level

Be friendly and engaging!`;

            try {
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': apiKey,
                        'anthropic-version': '2023-06-01'
                    },
                    body: JSON.stringify({
                        model: 'claude-3-5-sonnet-20241022',
                        max_tokens: 1024,
                        system: systemPrompt,
                        messages: conversationHistory
                    })
                });

                if (!response.ok) {
                    throw new Error(`API error: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();
                const aiMessage = data.content[0].text;
                conversationHistory.push({ role: 'assistant', content: aiMessage });
                lastAIResponse = aiMessage;
                addMessage('ai', aiMessage);
                speakText(aiMessage);
                showStatus('Ready to continue', 'ready');
            } catch (error) {
                console.error('Error:', error);
                showStatus(`Error: ${error.message}`, 'error');
                conversationHistory.pop(); // Remove failed user message
            }
        }

        // Add message to chat
        function addMessage(role, text) {
            const container = document.getElementById('chatContainer');
            const msg = document.createElement('div');
            msg.className = `message ${role}`;
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = text;
            msg.appendChild(bubble);
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;
        }

        // Text-to-speech
        function speakText(text) {
            synthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';
            utterance.rate = 0.9;
            const voices = synthesis.getVoices();
            const frVoice = voices.find(v => v.lang.startsWith('fr'));
            if (frVoice) utterance.voice = frVoice;
            synthesis.speak(utterance);
        }

        // Speak last response
        function speakLastResponse() {
            if (lastAIResponse) speakText(lastAIResponse);
        }

        // End conversation
        function endConversation() {
            conversationHistory = [];
            lastAIResponse = '';
            currentTranscript = '';
            document.getElementById('chatContainer').innerHTML = '';
            document.getElementById('conversationScreen').classList.remove('active');
            document.getElementById('setupScreen').classList.add('active');
        }

        // Show status
        function showStatus(message, type = 'ready') {
            const status = document.getElementById('statusText');
            status.textContent = message;
            status.className = type;
        }

        // Load voices
        if (synthesis.onvoiceschanged !== undefined) {
            synthesis.onvoiceschanged = () => synthesis.getVoices();
        }
    </script>
</body>
</html>
