<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>French AI Conversation Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🇫🇷 French Conversation Practice</h1>
            <p>Practice speaking French with AI at your level</p>
        </header>

        <!-- Setup Screen -->
        <div id="setupScreen" class="screen active">
            <div class="setup-container">
                <h2>Choose Your Level</h2>
                <div id="levelSelection" class="selection-grid">
                    <!-- Levels will be populated by JavaScript -->
                </div>

                <h2>Choose a Topic</h2>
                <div id="topicSelection" class="selection-grid">
                    <!-- Topics will be populated by JavaScript -->
                </div>

                <h2>Choose AI Provider</h2>
                <div id="providerSelection" class="selection-grid">
                    <!-- Providers will be populated by JavaScript -->
                </div>

                <div id="modelSelection" class="model-selection" style="display: none;">
                    <h3>Choose Model (Optional)</h3>
                    <select id="modelSelect" class="model-select">
                        <option value="">Default Model</option>
                    </select>
                </div>

                <button id="startBtn" class="btn-primary" disabled>Start Conversation</button>
            </div>
        </div>

        <!-- Conversation Screen -->
        <div id="conversationScreen" class="screen">
            <div class="conversation-header">
                <div class="session-info">
                    <span id="currentLevel" class="badge"></span>
                    <span id="currentTopic" class="badge"></span>
                </div>
                <button id="endBtn" class="btn-secondary">End Conversation</button>
            </div>

            <div id="chatContainer" class="chat-container">
                <!-- Messages will be added here -->
            </div>

            <div class="input-container">
                <div class="transcription-box">
                    <div id="transcriptionText" class="transcription-text">
                        Click microphone to start speaking...
                    </div>
                    <div id="interimText" class="interim-text"></div>
                </div>

                <div class="controls">
                    <button id="micBtn" class="btn-mic" title="Click to speak">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            <line x1="12" y1="19" x2="12" y2="23"></line>
                            <line x1="8" y1="23" x2="16" y2="23"></line>
                        </svg>
                    </button>
                    <button id="sendBtn" class="btn-send" disabled>Send</button>
                    <button id="speakBtn" class="btn-speak" title="Hear AI response">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="status-bar">
                <span id="statusText">Ready</span>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
